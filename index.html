<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English System — Grammar Roadmap</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo-tag">// roadmap v2</div>
      <div class="logo-title">English System</div>
      <div class="logo-sub">Grammar · Logic · Fluency</div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label"><span id="progressCount">0/0 topics</span><span id="progressPct">0%</span></div>
      </div>
    </div>
    <div id="navContainer"></div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="menu-toggle" id="menuToggle">☰</div>
        <div class="crumb">ENGLISH-SYSTEM / <b id="crumbText">overview</b></div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search topic... (ex: 'present perfect')">
      </div>
      <div class="topbar-actions">
        <!-- Language picker -->
        <div class="lang-picker" id="langDropdown">
          <button class="lang-btn" id="langBtn" onclick="document.getElementById('langDropdown').classList.toggle('open')">
            🌐 EN <span class="lang-caret">▾</span>
          </button>
          <div class="lang-menu">
            <div class="lang-option" onclick="setLang(null)">
              <span class="lang-flag">🇬🇧</span> EN — English
            </div>
            <div class="lang-option" onclick="setLang('pt-BR')">
              <span class="lang-flag">🇧🇷</span> PT-BR — Português
            </div>
            <div class="lang-option" onclick="setLang('es')">
              <span class="lang-flag">🇪🇸</span> ES — Español
            </div>
            <div class="lang-option" onclick="setLang('zh-CN')">
              <span class="lang-flag">🇨🇳</span> 中文 — 简体中文
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- LANGUAGE FILES — UI translations (load before app.js) -->
<script src="js/lang/pt-BR.js"></script>
<script src="js/lang/es.js"></script>
<script src="js/lang/zh-CN.js"></script>

<!-- DATA — one file per grammar group -->
<script src="js/data/group-1.js"></script>
<script src="js/data/group-2.js"></script>
<script src="js/data/group-3.js"></script>
<script src="js/data/group-4.js"></script>
<script src="js/data/group-5.js"></script>
<script src="js/data/group-6.js"></script>
<script src="js/data/practice-data.js"></script>

<!-- DATA — reference tables -->
<script src="js/data/irregular-verbs.js"></script>
<script src="js/data/phrasal-verbs.js"></script>
<script src="js/data/collocations.js"></script>

<!-- APP ENGINE -->
<script src="js/app.js"></script>
</body>
</html>
